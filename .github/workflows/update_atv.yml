name: Update ATV Playlist

on:
  schedule:
    - cron: '0 */2 * * *'  # Alle 2 Stunden
  workflow_dispatch:  # Manueller Auslöser für den Workflow

jobs:
  build:
    runs-on: ubuntu-latest  # Ausführungsumgebung für den Job

    steps:
      - uses: actions/checkout@v3  # Repository auschecken

      - name: Set up Python  # Python einrichten
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'  # Python-Version

      - name: Install dependencies  # Abhängigkeiten installieren
        run: python -m pip install requests

      - name: Run fetch_atv script  # Skript zum Abrufen des ATV-Streams ausführen
        run: python3 fetch_atv.py

      - name: Commit & Push changes  # Änderungen committen und pushen
        run: |
          git add result/List/ATV.m3u8
          git commit -m "ATV Playlist updated" || echo "Keine Änderungen zum Committen"
          git push || echo "Keine Änderungen zum Pushen"
